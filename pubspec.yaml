name: foodpilot
description: "Catat penjualan harian dan lihat menu mana yang benar-benar untung."
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.47.5 membawa Dart 3.13.4. Jangan naikkan tanpa menaikkan Flutter.
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State dan navigasi
  flutter_riverpod: ^3.0.0
  # Dikunci di 17.x. Versi 18 pindah ke package:material_ui, sementara
  # aplikasi ini memakai package:flutter/material.dart. Mencampur keduanya
  # membuat transisi halaman hilang. Lihat CONTEXT.md bagian 1.
  go_router: ">=17.0.0 <18.0.0"

  # Database lokal
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0

  # Tampilan
  lucide_icons_flutter: ^3.1.20

  # Layanan
  supabase_flutter: ^2.17.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  pdf: ^3.13.1
  printing: ^5.15.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    # OFL.txt ikut dibundel supaya lisensi font bisa dibaca di halaman
    # lisensi aplikasi.
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
